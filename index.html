<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieHub - 电影介绍系统</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- 顶部导航栏 -->
    <header class="header">

        <div class="logo">
            🎬 MovieHub
        </div>

        <nav class="nav">
            <a href="#" class="active">首页</a>
            <a href="#movies">电影</a>
            <a href="#ranking">排行榜</a>
            <a href="#about">关于</a>
        </nav>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="搜索电影..."
            >
            <button id="searchBtn">搜索</button>
        </div>

    </header>


    <!-- 主体内容 -->
    <main>

        <!-- 首页大图区域 -->
        <section class="hero">

            <div class="hero-content">

                <p class="hero-label">MOVIE OF THE DAY</p>

                <h1>星际穿越</h1>

                <div class="hero-info">
                    <span>⭐ 9.4</span>
                    <span>2014</span>
                    <span>科幻</span>
                    <span>剧情</span>
                </div>

                <p class="hero-description">
                    一部关于时间、空间、爱与人类未来的科幻电影。
                    当地球逐渐无法适合人类生存，一群宇航员踏上寻找新家园的旅程。
                </p>

                <button class="detail-btn" onclick="showMovieDetail(1)">
                    查看详情
                </button>

            </div>

        </section>


        <!-- 热门电影 -->
        <section class="movie-section" id="movies">

            <div class="section-title">

                <div>
                    <p class="small-title">EXPLORE</p>
                    <h2>热门电影</h2>
                </div>

                <div class="category-buttons">
                    <button class="category-btn active" data-category="全部">
                        全部
                    </button>

                    <button class="category-btn" data-category="科幻">
                        科幻
                    </button>

                    <button class="category-btn" data-category="动作">
                        动作
                    </button>

                    <button class="category-btn" data-category="剧情">
                        剧情
                    </button>

                    <button class="category-btn" data-category="喜剧">
                        喜剧
                    </button>
                </div>

            </div>


            <!-- JavaScript会把电影放到这里 -->
            <div class="movie-grid" id="movieGrid"></div>

        </section>


        <!-- 排行榜 -->
        <section class="ranking-section" id="ranking">

            <div class="section-title">
                <div>
                    <p class="small-title">TOP MOVIES</p>
                    <h2>评分排行榜</h2>
                </div>
            </div>

            <div class="ranking-list" id="rankingList"></div>

        </section>


        <!-- 关于 -->
        <section class="about-section" id="about">

            <h2>关于 MovieHub</h2>

            <p>
                MovieHub 是一个电影介绍与评分网站。
                本项目使用 HTML、CSS 和 JavaScript 开发，
                后续将逐步加入 Node.js、MySQL、Vue、Python 和 FastAPI。
            </p>

        </section>

    </main>


    <!-- 电影详情弹窗 -->
    <div class="modal" id="movieModal">

        <div class="modal-content">

            <button class="close-btn" onclick="closeMovieDetail()">
                ×
            </button>

            <div id="movieDetail"></div>

        </div>

    </div>


    <!-- JavaScript -->
    <script src="js/app.js"></script>

</body>

</html>
